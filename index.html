<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵感预览 · 1000种生活提案</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0c29;
      color: #fff;
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: rgba(255,255,255,0.04);
      border-radius: 32px;
      padding: 40px 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.06);
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #888;
      font-size: 16px;
      margin-bottom: 30px;
    }
    .series-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }
    .series-tag {
      padding: 10px 20px;
      border-radius: 100px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: #aaa;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.25s ease;
      user-select: none;
    }
    .series-tag:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
      transform: translateY(-2px);
    }
    .series-tag.active {
      background: rgba(251, 191, 36, 0.2);
      border-color: #fbbf24;
      color: #fbbf24;
      box-shadow: 0 0 30px rgba(251, 191, 36, 0.08);
    }
    .result-area {
      min-height: 300px;
      padding: 20px 0;
    }
    .loading {
      text-align: center;
      color: #666;
      padding: 60px 0;
      font-size: 18px;
    }
    .empty-state {
      text-align: center;
      color: #555;
      padding: 60px 0;
      font-size: 18px;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .item-card {
      background: rgba(255,255,255,0.04);
      border-radius: 16px;
      padding: 18px 24px;
      margin-bottom: 12px;
      border-left: 4px solid #fbbf24;
      animation: fadeUp 0.4s ease both;
    }
    .item-card:nth-child(1) { animation-delay: 0.05s; border-left-color: #fbbf24; }
    .item-card:nth-child(2) { animation-delay: 0.10s; border-left-color: #60a5fa; }
    .item-card:nth-child(3) { animation-delay: 0.15s; border-left-color: #34d399; }
    .item-card:nth-child(4) { animation-delay: 0.20s; border-left-color: #f472b6; }
    .item-card:nth-child(5) { animation-delay: 0.25s; border-left-color: #a78bfa; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .item-card .meta {
      display: flex;
      gap: 12px;
      font-size: 13px;
      color: #888;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .item-card .meta .series-id {
      color: #fbbf24;
      font-weight: 600;
    }
    .item-card .title {
      font-size: 20px;
      font-weight: 600;
      margin: 4px 0;
    }
    .item-card .desc {
      color: #999;
      font-size: 15px;
      margin-top: 4px;
      line-height: 1.5;
    }
    .item-card .tags {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .item-card .tags span {
      background: rgba(255,255,255,0.06);
      padding: 2px 14px;
      border-radius: 20px;
      font-size: 12px;
      color: #777;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 4px;
      color: #555;
      font-size: 14px;
      border-top: 1px solid rgba(255,255,255,0.04);
      margin-top: 10px;
    }
    .stats .count { color: #fbbf24; }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ 灵感预览</h1>
    <p class="subtitle">选择一个领域，立即预览 5 条精选内容</p>

    <div class="series-grid" id="seriesGrid"></div>

    <div class="result-area" id="resultArea">
      <div class="empty-state">
        <div class="icon">👆</div>
        <div>点击上方任意标签开始预览</div>
      </div>
    </div>

    <div class="stats">
      <span>📚 内容来源 · 1000种生活提案</span>
      <span class="count" id="resultCount"></span>
    </div>
  </div>

  <script>
    const SERIES_MAP = [
      { id: 'A', label: '不玩手机', emoji: '📱' },
      { id: 'B', label: '人物传记', emoji: '👤' },
      { id: 'C', label: '创业案例', emoji: '🚀' },
      { id: 'D', label: '经典电影', emoji: '🎬' },
      { id: 'E', label: '必读书目', emoji: '📖' },
      { id: 'F', label: '家常菜谱', emoji: '🍳' },
      { id: 'G', label: '极简妙招', emoji: '🧹' },
      { id: 'H', label: '周末去处', emoji: '🌿' },
      { id: 'I', label: '治愈时刻', emoji: '🌅' },
      { id: 'J', label: '搞钱知识', emoji: '💰' },
    ];

    function renderSeries() {
      const grid = document.getElementById('seriesGrid');
      grid.innerHTML = SERIES_MAP.map(s =>
        `<div class="series-tag" data-series="${s.id}" onclick="selectSeries('${s.id}')">
          ${s.emoji} ${s.label}
        </div>`
      ).join('');
    }

    async function selectSeries(seriesId) {
      document.querySelectorAll('.series-tag').forEach(el => {
        el.classList.toggle('active', el.dataset.series === seriesId);
      });

      const area = document.getElementById('resultArea');
      area.innerHTML = `<div class="loading">加载中...</div>`;

      try {
        const resp = await fetch(`/api/preview?series=${seriesId}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        if (data.length === 0) {
          area.innerHTML = `
            <div class="empty-state">
              <div class="icon">📭</div>
              <div>该领域暂无内容，请尝试其他系列</div>
            </div>
          `;
          document.getElementById('resultCount').textContent = '0 条';
          return;
        }

        area.innerHTML = data.map(item => {
          // 构造元信息行
          let metaExtra = '';
          if (item.author) {
            metaExtra += `<span>✍️ ${item.author}</span>`;
          }
          if (item.publish_year) {
            metaExtra += `<span>📅 ${item.publish_year}</span>`;
          }
          if (item.rating) {
            metaExtra += `<span>⭐ ${item.rating}</span>`;
          }
          if (!item.author && item.cost_time) {
            metaExtra += `<span>⏱ ${item.cost_time}</span>`;
          }
          if (item.mood_tag) {
            metaExtra += `<span>#${item.mood_tag}</span>`;
          }

          return `
            <div class="item-card">
              <div class="meta">
                <span class="series-id">【${item.series_id}】</span>
                ${metaExtra}
              </div>
              <div class="title">${item.title}</div>
              ${item.description ? `<div class="desc">${item.description}</div>` : ''}
              <div class="tags">
                <span>系列 ${item.series_id}</span>
                ${item.genre ? `<span>${item.genre}</span>` : ''}
                ${item.mood_tag && !item.genre ? `<span>${item.mood_tag}</span>` : ''}
              </div>
            </div>
          `;
        }).join('');

        document.getElementById('resultCount').textContent = `${data.length} 条内容`;

      } catch (err) {
        area.innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <div>加载失败: ${err.message}</div>
          </div>
        `;
        console.error('预览加载失败:', err);
      }
    }

    renderSeries();
    setTimeout(() => {
      const first = SERIES_MAP[0].id;
      document.querySelector(`.series-tag[data-series="${first}"]`)?.classList.add('active');
      selectSeries(first);
    }, 100);
  </script>
</body>
</html>
